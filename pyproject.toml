[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uiuc-parttime-job-scanner"
version = "0.1.0"
description = "Scans the UIUC Virtual Job Board, mirrors postings into SQLite, and triages them in a GUI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "customtkinter>=5.2.0",
]

[project.scripts]
jobscanner = "jobscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
